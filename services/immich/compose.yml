services:
  immich-server:
    container_name: immich_server
    hostname: immich_server
    image: ghcr.io/immich-app/immich-server:v1.139.2
    user: "${PUID}:${PGID}"
    volumes:
      - "${DATA_DIR}/immich/cache:/data"
      - "/etc/localtime:/etc/localtime:ro"
      # Using external libraries
      - "${BPHENRIQUES_PHOTOS_LIBRARY}:/mnt/media/bphenriques:ro"
    environment:
      - DB_USERNAME=postgres
      - DB_DATABASE_NAME=immich
      - DB_HOSTNAME=immich_postgres
      - REDIS_HOSTNAME=immich_redis
    env_file:
      - "${HOME_SERVER_SECRETS_DIR}/immich.env"
    depends_on:
      - redis
      - database
    restart: unless-stopped
    networks:
      - immich
      - immich-private
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.immich.rule=Host("immich.${HOME_SERVER_CNAME}") || Host("photos.${HOME_SERVER_CNAME}")'
      - "traefik.http.routers.immich.entrypoints=websecure"
      - "traefik.http.services.immich-websecure.loadbalancer.server.port=2283"
      - 'traefik.docker.network=immich'

  # https://immich.app/docs/FAQ#how-can-i-lower-immichs-cpu-usage
  immich-machine-learning:
    container_name: immich_machine_learning
    hostname: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:v1.139.2
    user: "${PUID}:${PGID}"
    environment:
      - MPLCONFIGDIR=/data/matplotlib-cache
    volumes:
      - "${DATA_DIR}/immich/machine-learning/cache:/cache"
      - "${DATA_DIR}/immich/machine-learning/matplotlib-cache:/data/matplotlib-cache"
    restart: unless-stopped
    networks:
      - immich-private

  redis:
    container_name: immich_redis
    hostname: immich_redis
    image: docker.io/valkey/valkey:8-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
    healthcheck:
      test: redis-cli ping || exit 1
    user: "${PUID}:${PGID}"
    restart: unless-stopped
    volumes:
      - "${DATA_DIR}/immich/redis:/data"
    networks:
      - immich-private

  database:
    container_name: immich_postgres
    hostname: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:32324a2f41df5de9efe1af166b7008c3f55646f8d0e00d9550c16c9822366b4a
    user: "${PUID}:${PGID}"
    env_file:
      - "${HOME_SERVER_SECRETS_DIR}/immich.env"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=immich
    volumes:
      - "${DATA_DIR}/immich/postgres:/var/lib/postgresql/data"
    restart: unless-stopped
    shm_size: 128mb
    networks:
      - immich-private

networks:
  immich-private:
    name: immich-private
  immich:
    external: true

